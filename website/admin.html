<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - 10 Days Challenge</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
    }
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }
    .tabs {
      display: flex;
      gap: 16px;
      margin-bottom: 30px;
    }
    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border-2);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-head);
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--brand-1);
      color: #fff;
      border-color: var(--brand-1);
    }
    .tab-content {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-2);
    }
    th {
      font-family: var(--font-head);
      color: var(--text-mut);
      font-weight: 600;
    }
    td {
      color: var(--text);
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .status.pending { background: #fff3cd; color: #856404; }
    .status.success { background: #d4edda; color: #155724; }
    
    .form-add {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      background: var(--surface-2);
      padding: 16px;
      border-radius: 8px;
    }
    .form-add input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid var(--border-2);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
    }
    .form-add button {
      padding: 10px 24px;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <h2>Hệ thống Quản lý (CRM)</h2>
      <a href="/" class="btn btn--outline" style="padding: 10px 20px;">Về Website</a>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('orders')">Đơn hàng</button>
      <button class="tab-btn" onclick="switchTab('products')">Sản phẩm</button>
      <button class="tab-btn" onclick="switchTab('customers')">Khách hàng</button>
    </div>

    <!-- Tab Đơn hàng -->
    <div id="tab-orders" class="tab-content active">
      <h3>Danh sách Đơn hàng</h3>
      <table id="table-orders">
        <thead>
          <tr>
            <th>ID</th>
            <th>Khách hàng</th>
            <th>Sản phẩm</th>
            <th>Mã GD (QR)</th>
            <th>Trạng thái</th>
            <th>Ngày tạo</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <!-- render bằng JS -->
        </tbody>
      </table>
    </div>

    <!-- Tab Sản phẩm -->
    <div id="tab-products" class="tab-content">
      <h3>Quản lý Sản phẩm</h3>
      <div class="form-add">
        <input type="text" id="add-prod-name" placeholder="Tên gói (VD: Hỗ trợ 1:1)">
        <input type="number" id="add-prod-price" placeholder="Giá tiền (VD: 99000)">
        <input type="text" id="add-prod-desc" placeholder="Mô tả ngắn">
        <button class="btn btn--primary" onclick="addProduct()">Thêm Sản phẩm</button>
      </div>
      <table id="table-products">
        <thead>
          <tr>
            <th>ID</th>
            <th>Tên Gói</th>
            <th>Giá</th>
            <th>Mô tả</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>

    <!-- Tab Khách hàng -->
    <div id="tab-customers" class="tab-content">
      <h3>Danh sách Khách hàng</h3>
      <table id="table-customers">
        <thead>
          <tr>
            <th>ID</th>
            <th>Tên</th>
            <th>Số điện thoại</th>
            <th>Email</th>
            <th>Ngày tham gia</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabId).classList.add('active');
      event.target.classList.add('active');
      
      loadData(tabId);
    }

    async function loadData(tab) {
      try {
        const res = await fetch(`/api/${tab}`);
        const data = await res.json();
        
        const tbody = document.querySelector(`#table-${tab} tbody`);
        tbody.innerHTML = '';

        if (tab === 'products') {
          data.forEach(item => {
            tbody.innerHTML += `<tr>
              <td>#${item.id}</td>
              <td><strong>${item.name}</strong></td>
              <td>${item.price.toLocaleString()}đ</td>
              <td>${item.description || ''}</td>
            </tr>`;
          });
        } 
        else if (tab === 'customers') {
          data.forEach(item => {
            tbody.innerHTML += `<tr>
              <td>#${item.id}</td>
              <td><strong>${item.name}</strong></td>
              <td>${item.phone || '-'}</td>
              <td>${item.email || '-'}</td>
              <td>${new Date(item.created_at).toLocaleString()}</td>
            </tr>`;
          });
        }
        else if (tab === 'orders') {
          data.forEach(item => {
            tbody.innerHTML += `<tr>
              <td>#${item.id}</td>
              <td><strong>${item.customer_name || 'Khách #' + item.customer_id}</strong></td>
              <td>${item.product_name || 'Sản phẩm #' + item.product_id}</td>
              <td>${item.payment_code || '-'}</td>
              <td><span class="status ${item.status}">${item.status.toUpperCase()}</span></td>
              <td>${new Date(item.created_at).toLocaleString()}</td>
              <td>
                ${item.status === 'pending' ? `<button class="btn btn--sm" style="padding: 4px 8px; font-size: 0.8rem;" onclick="updateOrderStatus(${item.id}, 'success')">Duyệt thủ công</button>` : ''}
              </td>
            </tr>`;
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function addProduct() {
      const name = document.getElementById('add-prod-name').value;
      const price = document.getElementById('add-prod-price').value;
      const desc = document.getElementById('add-prod-desc').value;

      if (!name || !price) return alert("Nhập đủ tên và giá!");

      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price: Number(price), description: desc })
      });

      if (res.ok) {
        document.getElementById('add-prod-name').value = '';
        document.getElementById('add-prod-price').value = '';
        document.getElementById('add-prod-desc').value = '';
        loadData('products');
      }
    }

    async function updateOrderStatus(id, status) {
      if (!confirm("Bạn có chắc chắn muốn chuyển trạng thái đơn hàng này?")) return;
      
      const res = await fetch('/api/orders/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, status })
      });
      
      if (res.ok) {
        loadData('orders');
      } else {
        alert("Có lỗi xảy ra khi cập nhật!");
      }
    }

    // Tải dữ liệu tab mặc định
    loadData('orders');
  </script>
</body>
</html>
